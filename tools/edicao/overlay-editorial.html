<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;font-weight:700;src:url("file:///home/user/Nc-insta/modelos/fontes/archivo-latin-700-normal.woff2")}
@font-face{font-family:A;font-weight:600;src:url("file:///home/user/Nc-insta/modelos/fontes/archivo-latin-600-normal.woff2")}
@font-face{font-family:B;font-style:italic;font-weight:400;src:url("file:///home/user/Nc-insta/modelos/fontes/bodoni-moda-latin-400-italic.woff2")}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:A}
#kin{position:absolute;left:0;right:0;top:220px;height:420px;color:#fff}
.big{position:absolute;left:0;right:0;top:90px;text-align:center;font-weight:700;font-size:230px;letter-spacing:-11px;line-height:1}
.sem{position:absolute;left:150px;top:20px;font-family:B;font-style:italic;font-weight:400;font-size:150px;line-height:1}
.sub{position:absolute;left:0;right:0;top:340px;text-align:center;font-weight:600;font-size:40px;letter-spacing:.42em}
.l{display:inline-block;text-shadow:0 12px 60px rgba(0,0,0,.30)}
.card{position:absolute;left:70px;top:1150px;width:940px;height:350px;border-radius:44px;box-sizing:border-box;color:#fff;padding:46px 56px}
.claro{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:2px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 30px 80px rgba(0,0,0,.22)}
.fume{background:linear-gradient(135deg,rgba(18,14,15,.50),rgba(18,14,15,.30));border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 30px 80px rgba(0,0,0,.30)}
.eb{font-weight:600;letter-spacing:.26em;font-size:28px;opacity:.85}
.pill{position:absolute;right:44px;top:36px;border-radius:999px;padding:12px 26px;font-weight:600;font-size:30px}
.claro .pill{background:rgba(20,16,17,.40)} .fume .pill{background:rgba(255,255,255,.16)}
.num{position:absolute;left:56px;bottom:44px;display:flex;align-items:baseline;gap:20px}
.n{font-weight:700;font-size:156px;letter-spacing:-7px;line-height:1}
.it{font-family:B;font-style:italic;font-weight:400;font-size:100px}
</style></head><body>
<div id="kin"><div class="sem" id="sem">sem</div><div class="big" id="big"></div><div class="sub" id="sub"></div></div>
<div class="card" id="card"><div class="eb">AULA AO VIVO</div><div class="pill">terça</div>
<div class="num"><span class="n">10/11</span><span class="it">às 20h</span></div></div>
<script>
document.getElementById('card').classList.add(location.hash==='#fume'?'fume':'claro');
const mk=(id,t)=>{const e=document.getElementById(id);e.innerHTML=[...t].map(c=>`<span class="l">${c===' '?'&nbsp;':c}</span>`).join('');return [...e.children]};
const L1=mk('big','TEMPO'), L3=mk('sub','PRA POSTAR?'), sem=document.getElementById('sem');
const ease=t=>{t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,4)};
window.setT=(s)=>{
 const out=ease((s-2.35)/0.5);
 L1.forEach((e,i)=>{const k=ease((s-0.1-i*0.075)/0.6);e.style.opacity=k*(1-out);
  e.style.filter=`blur(${(1-k)*20+out*16}px)`;e.style.transform=`translateY(${(1-k)*110-out*70}px) scale(${0.55+0.45*k})`});
 const ks=ease((s-0.55)/0.6);sem.style.opacity=ks*(1-out);sem.style.filter=`blur(${(1-ks)*12+out*14}px)`;sem.style.transform=`translateX(${(1-ks)*-50}px)`;
 L3.forEach((e,i)=>{const k=ease((s-0.75-i*0.03)/0.5);e.style.opacity=k*(1-out)*0.95;e.style.filter=`blur(${(1-k)*8+out*10}px)`});
 const c=document.getElementById('card');const ck=ease((s-1.3)/0.65);c.style.opacity=ck;c.style.transform=`translateY(${(1-ck)*60}px) scale(${0.96+0.04*ck})`;
};
</script></body></html>
