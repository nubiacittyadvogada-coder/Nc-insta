<!doctype html><html><head><meta charset="utf-8"><style>
/* Motor de efeitos (06/11/2026). Duas camadas: ?bg (atrás da pessoa) e ?fg (na frente).
   Configuração por vídeo em window.FX (arquivo fx.js ao lado do HTML), tempos na linha do corte (antes do 1,1x). */
@font-face{font-family:S;src:url("file:///home/user/Nc-insta/modelos/fontes/bodoni-moda-latin-400-normal.woff2")}
@font-face{font-family:S;font-style:italic;src:url("file:///home/user/Nc-insta/modelos/fontes/bodoni-moda-latin-400-italic.woff2")}
@font-face{font-family:A;font-weight:500;src:url("file:///home/user/Nc-insta/modelos/fontes/archivo-latin-500-normal.woff2")}
@font-face{font-family:A;font-weight:600;src:url("file:///home/user/Nc-insta/modelos/fontes/archivo-latin-600-normal.woff2")}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;color:#F4EDE6}
.L{position:absolute;inset:0;opacity:0}.a{position:absolute;opacity:0}
.img{position:absolute;inset:0;background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.05) 42%,rgba(0,0,0,.38))}
.k{font-family:A;font-weight:600;font-size:26px;letter-spacing:.32em;color:#F0C3CC;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.big{font-family:S;font-size:300px;line-height:.8;letter-spacing:-6px;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.ttl{font-family:S;font-size:100px;line-height:1.02;text-shadow:0 6px 30px rgba(0,0,0,.5)}.ttl i{font-style:italic;color:#F0C3CC}
.tag{font-family:A;font-weight:600;font-size:26px;letter-spacing:.26em;padding:14px 20px;border:1.5px solid rgba(244,237,230,.85);display:inline-block;background:rgba(20,14,12,.4)}
.card{position:absolute;left:70px;right:70px;top:170px;background:rgba(20,14,12,.78);border:1px solid rgba(244,237,230,.25);border-radius:24px;padding:30px 36px}
.grid{display:grid;row-gap:22px;align-items:center;font-family:A;font-weight:500;font-size:40px}
.grid .h{font-weight:600;font-size:22px;letter-spacing:.24em;color:#F0C3CC;text-align:center}
.ck{font-size:52px;text-align:center;opacity:0}
.cm{position:absolute;background:#fff;color:#1b1416;border-radius:24px;padding:20px 26px;font-family:A;font-weight:500;font-size:36px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;gap:16px;align-items:center;opacity:0;max-width:820px}
.cm .av{width:52px;height:52px;border-radius:50%;background:#cfc6bf;flex:none}.cm .u{font-size:19px;color:#7a6e6a;font-weight:600;display:block;margin-bottom:4px}
.st{position:relative;display:inline-block}.strike{position:absolute;left:-2%;top:56%;height:6px;background:#8E2A3E;width:0}
.lst{font-family:A;font-weight:500;font-size:40px;line-height:1.5;text-align:left;display:inline-block}
.lst div{opacity:0}.lst b{color:#F0C3CC;font-weight:600;margin-right:16px}
.fl{position:absolute;inset:0;background:#fff;opacity:0}
</style><script src="modulos.js"></script><script src="fx.js"></script></head><body><div class="L" id="bg"></div><div class="L" id="fg"></div>
<script>
const LAYER=(location.search||'?fg').slice(1);document.getElementById(LAYER).style.opacity=1;
const E=t=>{t=Math.max(0,Math.min(1,t));return 1-Math.pow(1-t,3)};const H=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const FX=window.FX||{events:[]};const R=[];let flashes=[];
const BGT=['cover','img','text','strike','comments'];
FX.events.forEach((e,i)=>{const host=document.getElementById(e.layer||(BGT.includes(e.type)?'bg':'fg'));let el,up;
 const top=e.top||200;
 if(window.FXMOD&&FXMOD.M[e.type]){const r=FXMOD.M[e.type](e);el=r.el;up=r.up;if(r.own)e._own=1}
 else if(e.type==='cover'){el=H(`<div class="a" style="left:0;right:0;top:${top-30}px;text-align:center"><div class="k">${e.k||''}</div><div class="big" style="margin-top:22px">${e.big}</div></div>`);const b=el.querySelector('.big');up=s=>{b.style.letterSpacing=(-6-14*E((s-e.t0)/2.5))+'px'}}
 else if(e.type==='img'){flashes.push(e.t0);el=H(`<div class="a" style="inset:0"><div class="img" style="background-image:url(${e.src})"></div><div class="shade"></div>${e.title?`<div class="ttl" style="position:absolute;left:40px;right:40px;top:${top}px;text-align:center;font-size:${e.size||96}px">${e.title}</div>`:''}${e.label?`<div style="position:absolute;left:0;right:0;top:${e.title?top-70:top}px;text-align:center"><span class="tag">${e.label}</span></div>`:''}</div>`);const im=el.querySelector('.img');const z=e.kb||[1,1.12];up=s=>{const p=Math.max(0,Math.min(1,(s-e.t0)/(e.t1-e.t0)));im.style.transform=`scale(${z[0]+(z[1]-z[0])*p})`}}
 else if(e.type==='text'){el=H(`<div class="a" style="${e.band?'left:0;right:0;padding:34px 40px 40px;background:linear-gradient(rgba(0,0,0,0),rgba(15,10,9,.62) 22%,rgba(15,10,9,.62) 78%,rgba(0,0,0,0))':'left:40px;right:40px'};top:${top}px;text-align:center">${e.k?`<div class="k">${e.k}</div>`:''}<div class="ttl" style="margin-top:14px;font-size:${e.size||100}px">${e.ttl}</div>${e.sub?`<div class="k sb" style="margin-top:18px;${e.subAt?'opacity:0':''}">${e.sub}</div>`:''}</div>`);if(e.subAt){const sb=el.querySelector('.sb');up=s=>{const q=E((s-e.subAt)/0.4);sb.style.opacity=q;sb.style.transform=`translateY(${(1-q)*16}px)`}}}
 else if(e.type==='strike'){el=H(`<div class="a" style="left:40px;right:40px;top:${top}px;text-align:center">${e.k?`<div class="k">${e.k}</div>`:''}<div class="ttl" style="font-size:${e.size||90}px"><span class="st">${e.word}<span class="strike"></span></span></div><div class="ttl th" style="opacity:0;font-size:${e.size||90}px">${e.then||''}</div></div>`);const sk=el.querySelector('.strike'),th=el.querySelector('.th');up=s=>{sk.style.width=(108*E((s-e.at)/0.4))+'%';th.style.opacity=E((s-(e.thenAt||1e9))/0.4)}}
 else if(e.type==='comments'){el=H(`<div class="a" style="inset:0"></div>`);const pos=[[60,200,-2],[null,350,2],[100,500,-1],[null,650,1.5]];const cs=e.items.map((c,j)=>{const p=pos[j%4];const n=H(`<div class="cm" style="${p[0]!==null?'left:'+p[0]+'px':'right:60px'};top:${p[1]}px"><span class="av"></span><span><span class="u">${c.u}</span><span class="st">${c.txt}<span class="strike"></span></span></span></div>`);el.appendChild(n);return [n,c,p]});up=s=>cs.forEach(([n,c,p])=>{const q=E((s-c.at)/0.3);n.style.opacity=s<c.at?0:q;n.style.transform=`translateY(${(1-q)*30}px) rotate(${p[2]}deg)`;if(c.strikeAt)n.querySelector('.strike').style.width=(108*E((s-c.strikeAt)/0.4))+'%'})}
 else if(e.type==='compare'){const cols=e.cols.length;el=H(`<div class="card a" style="top:${top}px"><div class="grid" style="grid-template-columns:1fr ${'190px '.repeat(cols)}"><div></div>${e.cols.map(c=>`<div class="h">${c}</div>`).join('')}${e.rows.map(r=>`<div>${r.label}</div>${r.at.map(()=>`<div class="ck">✓</div>`).join('')}`).join('')}</div></div>`);const cks=[...el.querySelectorAll('.ck')];const ats=e.rows.flatMap(r=>r.at);up=s=>cks.forEach((c,j)=>{const q=E((s-ats[j])/0.25);c.style.opacity=s<ats[j]?0:q;c.style.transform=`scale(${0.4+0.6*q})`})}
 else if(e.type==='counter'){el=H(`<div class="a" style="${e.side==='left'?'left':'right'}:70px;top:${top}px;text-align:center"><svg width="240" height="240" viewBox="0 0 220 220"><circle cx="110" cy="110" r="96" fill="rgba(20,14,12,.6)" stroke="rgba(244,237,230,.25)" stroke-width="6"/><circle class="arc" cx="110" cy="110" r="96" fill="none" stroke="#F0C3CC" stroke-width="8" stroke-linecap="round" transform="rotate(-90 110 110)" stroke-dasharray="603" stroke-dashoffset="603"/><text class="tx" x="110" y="128" text-anchor="middle" font-family="S" font-size="60" fill="#F4EDE6"></text></svg><div class="k" style="margin-top:10px">${e.label||''}</div></div>`);const arc=el.querySelector('.arc'),tx=el.querySelector('.tx');up=s=>{const p=E((s-e.t0-0.2)/(e.dur||2.4));arc.style.strokeDashoffset=603*(1-p);tx.textContent=Math.round(e.from+(e.to-e.from)*p)+(e.suffix||'')}}
 else if(e.type==='tag'){el=H(`<div class="a" style="${e.left!=null?'left:'+e.left+'px':'left:0;right:0;text-align:center'};top:${top}px"><span class="tag" ${e.accent?'style="border-color:#F0C3CC;color:#F0C3CC"':''}>${e.text}</span></div>`)}
 else if(e.type==='list'){el=H(`<div class="card a" style="top:${top}px">${e.k?`<div class="k" style="margin-bottom:12px">${e.k}</div>`:''}<div class="lst">${e.items.map((it,j)=>`<div><b>${String(j+1).padStart(2,'0')}</b>${it.txt}</div>`).join('')}</div></div>`);const ds=[...el.querySelectorAll('.lst div')];up=s=>ds.forEach((d,j)=>{const at=e.items[j].at;const q=E((s-at)/0.3);d.style.opacity=s<at?0:q;d.style.transform=`translateX(${(1-q)*-30}px)`})}
 host.appendChild(el);R.push([el,e,up])});
const fl=H('<div class="fl"></div>');document.getElementById('fg').appendChild(fl);
window.setT=(s)=>{R.forEach(([el,e,up])=>{const io=e.io||0.3;const v=Math.min(E((s-e.t0)/io),1-E((s-(e.t1-io))/io));el.style.opacity=(s<e.t0||s>e.t1)?0:v;if(!['img','comments'].includes(e.type)&&!e._own)el.style.transform=`translateY(${(1-E((s-e.t0)/io))*20}px)`;if(up)up(s)});
 let f=0;flashes.forEach(t=>{const d=s-t;if(d>=0&&d<0.18)f=Math.max(f,0.5*(1-d/0.18))});fl.style.opacity=f};
</script></body></html>
