let cur='e1';function setE(k){cur=k}

 const e=E[k];const out=1-ease((t-(e.b-0.45))/0.45);el.style.opacity=Math.min(ease(t/0.35),out);
 for(const [id,t0,t1] of e.parts){let p=ease((t-t0)/0.5);if(t1)p*=1-ease((t-(t1-0.35))/0.35);const n=document.getElementById(id);n.style.opacity=p;n.style.transform=`translateY(${(1-p)*24}px)`}
