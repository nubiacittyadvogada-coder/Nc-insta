<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;font-weight:700;src:url("file:///home/user/Nc-insta/modelos/fontes/archivo-latin-700-normal.woff2")}
@font-face{font-family:A;font-weight:600;src:url("file:///home/user/Nc-insta/modelos/fontes/archivo-latin-600-normal.woff2")}
@font-face{font-family:B;font-style:italic;font-weight:400;src:url("file:///home/user/Nc-insta/modelos/fontes/bodoni-moda-latin-400-italic.woff2")}
@font-face{font-family:B;font-style:italic;font-weight:600;src:url("file:///home/user/Nc-insta/modelos/fontes/bodoni-moda-latin-600-italic.woff2")}
:root{--p:#111111;--f:#F3F1EE;--d:#D8C4B6;--a:#E6DAD1}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:A}
.g{position:absolute;opacity:0}
.tab{display:inline-block;background:var(--p);color:var(--f);font-weight:600;font-size:24px;letter-spacing:.22em;padding:12px 26px 10px;border-radius:16px 16px 0 0;margin-left:36px;white-space:nowrap}
.ficha{background:rgba(243,241,238,.95);color:var(--p);border-radius:26px;padding:32px 40px 30px;box-shadow:0 30px 80px rgba(0,0,0,.30);border-top:6px solid var(--p)}
.ft{font-weight:700;font-size:58px;letter-spacing:-2px;line-height:1}.ft em{font-family:B;font-style:italic;font-weight:400;letter-spacing:0;color:#8a6f5e}
.sub{margin-top:12px;font-weight:600;font-size:28px;letter-spacing:.06em;color:#5b4c43}
#nome,#serie{left:70px;top:1180px;width:940px}
.tl{position:relative;display:flex;justify-content:space-between;align-items:center;margin:30px 6px 0;height:30px}
.tl .ln{position:absolute;left:0;right:0;top:13px;height:4px;background:var(--a);border-radius:3px}
.dt{position:relative;width:26px;height:26px;border-radius:50%;background:var(--f);border:4px solid var(--d)}.dt.on{border-color:var(--p);background:var(--p)}
#cont{left:0;right:0;top:150px;text-align:center;color:#fff}
.pill{display:inline-block;white-space:nowrap;border-radius:999px;padding:10px 22px;font-weight:600;font-size:26px;letter-spacing:.14em;background:rgba(17,17,17,.6);border:1px solid rgba(255,255,255,.25)}
#cont .n{font-family:B;font-style:italic;font-weight:600;font-size:190px;line-height:1.05;margin-top:8px;text-shadow:0 10px 50px rgba(0,0,0,.35)}
#cont .u{width:420px;height:34px;background:var(--d);margin:-64px auto 0;transform-origin:left;position:relative;z-index:-1;border-radius:4px;opacity:.85}
#lista{right:60px;top:1200px;display:flex;flex-direction:column;align-items:flex-end;gap:16px;opacity:1}
.tag{display:flex;align-items:center;gap:16px;padding:16px 28px;border-radius:999px;font-weight:600;font-size:36px;opacity:0;background:rgba(243,241,238,.95);color:var(--p);box-shadow:0 14px 40px rgba(0,0,0,.25)}
.tag b{font-size:24px;letter-spacing:.1em;color:#8a6f5e}
#stack{left:0;right:0;top:90px;text-align:center;line-height:.9;color:var(--f)}
#stack .a{font-weight:700;font-size:118px;letter-spacing:-5px}
#stack .b{font-family:B;font-style:italic;font-size:96px;margin:-6px 0;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.4)}
.box{display:inline-block;background:var(--p);padding:4px 28px 12px;border-radius:14px}
#faixa{left:0;top:1300px;width:1080px;box-sizing:border-box;padding:30px 70px;background:var(--p);color:var(--f);box-shadow:0 20px 60px rgba(0,0,0,.35);white-space:nowrap;border-top:4px solid var(--d)}
#faixa .k{font-weight:600;font-size:26px;letter-spacing:.3em;color:var(--d)}#faixa .v{font-family:B;font-style:italic;font-weight:600;font-size:76px;line-height:1.1;margin-top:6px}
</style></head><body>
<div class="g" id="nome"><div class="tab">NC ADVOGADOS</div><div class="ficha"><div class="ft">José <em>Matheus</em></div><div class="sub">ADVOGADO</div></div></div>
<div class="g" id="serie"><div class="tab">EP 01</div><div class="ficha"><div class="ft">Plantão do <em>INSS</em></div>
<div class="tl"><span class="ln"></span><span class="dt on"></span><span class="dt"></span><span class="dt"></span><span class="dt"></span><span class="dt"></span><span class="dt"></span></div></div></div>
<div class="g" id="cont"><span class="pill">TRABALHO RURAL ANTES DE</span><div class="n" id="num">1950</div><div class="u" id="und"></div></div>
<div class="g" id="lista"><div class="tag"><b>01</b>certidão de casamento</div><div class="tag"><b>02</b>nota de venda da produção</div><div class="tag"><b>03</b>ficha do sindicato rural</div></div>
<div class="g" id="stack"><div class="a"><span class="box">SÓ</span></div><div class="b">testemunha</div><div class="a"><span class="box">NÃO BASTA</span></div></div>
<div class="g" id="faixa"><div class="k">ATENÇÃO</div><div class="v" id="vv"></div></div>
<script>
const $=id=>document.getElementById(id);
const e4=t=>{t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,4)};
function win(s,a,b){return [e4((s-a)/0.5),e4((s-(b-0.45))/0.45)]}
window.setT=(s)=>{
 let [i,o]=win(s,0.1,3.2);let E=$('nome');E.style.opacity=i*(1-o);E.style.transform=`translateY(${(1-i)*70+o*30}px)`;
 [i,o]=win(s,3.3,6.4);E=$('serie');E.style.opacity=i*(1-o);E.style.transform=`translateY(${(1-i)*70+o*30}px)`;
 [i,o]=win(s,6.5,9.6);E=$('cont');E.style.opacity=i*(1-o);E.style.filter=`blur(${(1-i)*12+o*12}px)`;E.style.transform=`translateY(${(1-i)*40-o*40}px)`;
 $('num').textContent=1950+Math.round(e4((s-6.7)/1.4)*41);$('und').style.transform=`scaleX(${e4((s-7.4)/0.8)})`;
 E=$('lista');E.style.opacity=1-e4((s-12.6)/0.45);[...E.children].forEach((t,k)=>{const q=e4((s-9.8-k*0.6)/0.45);t.style.opacity=q;t.style.transform=`translateX(${(1-q)*80}px)`});
 [i,o]=win(s,13.1,15.6);E=$('stack');E.style.opacity=i*(1-o);[...E.children].forEach((r,k)=>{const q=e4((s-13.1-k*0.12)/0.5);r.style.transform=`translateY(${(1-q)*60}px)`;r.style.filter=`blur(${(1-q)*10+o*12}px)`});
 E=$('faixa');const st=e4((s-15.7)/0.45);E.style.opacity=s>15.7?1:0;E.style.transform=`translateX(${(1-st)*-1080}px)`;
 const txt='reúna os documentos antes.';const n=Math.max(0,Math.min(txt.length,Math.floor((s-16.15)/0.05)));$('vv').textContent=txt.slice(0,n)+(n<txt.length&&s>16.15?'|':'');
};
</script></body></html>
