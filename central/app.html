<style>
/* Layout: app de uma coluna para iPhone, barra inferior fixa, folhas (sheets) para criar e editar. */
:root {
  --bg: #F5F0EA; --surface: #FFFFFF; --surface2: #EFE7DD; --ink: #1B1416; --muted: #74676A; --line: #E3D8CC;
  --wine: #6B1E2E; --wine-ink: #FFFFFF; --gold: #A27C45; --ok: #2F6B4A; --warn: #9A6412; --bad: #A2322F;
  --serif: "Bodoni Moda", "Didot", Georgia, serif; --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141011; --surface: #1E1819; --surface2: #2A2223; --ink: #F2EAE4; --muted: #A8999C; --line: #352B2D;
  --wine: #B8495F; --wine-ink: #FFFFFF; --gold: #C9A46A; --ok: #6DBB8E; --warn: #E0A84E; --bad: #E27671; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141011; --surface: #1E1819; --surface2: #2A2223; --ink: #F2EAE4; --muted: #A8999C; --line: #352B2D;
  --wine: #B8495F; --wine-ink: #FFFFFF; --gold: #C9A46A; --ok: #6DBB8E; --warn: #E0A84E; --bad: #E27671; color-scheme: dark }
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font: 15px/1.45 var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); -webkit-font-smoothing: antialiased }
main { max-width: 760px; margin: 0 auto; padding-block: 18px 24px; display: grid; gap: 22px }
h1, h2, h3 { margin: 0; text-wrap: balance }
h1 { font: 600 30px/1.1 var(--serif); letter-spacing: -.01em }
h1 em, h2 em { color: var(--wine); font-style: italic }
h2 { font: 600 21px/1.2 var(--serif) }
h3 { font: 700 15px/1.3 var(--sans) }
p { margin: 0 }
.eyebrow { font: 700 11px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: 13px }
.stack { display: grid; gap: 12px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }
.head { display: grid; gap: 6px }
section { display: grid; gap: 12px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0 }
.card > .pill { justify-self: start }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 2px; text-align: left; color: inherit; font: inherit; cursor: pointer }
.tile b { font: 600 28px/1 var(--serif); font-variant-numeric: tabular-nums }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 9px 15px; font: 600 14px/1.1 var(--sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 40px }
.btn.primary { background: var(--wine); border-color: var(--wine); color: var(--wine-ink) }
.btn.ghost { background: transparent }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)) }
.btn:disabled { opacity: .5; cursor: default }
.btn:focus-visible, .tile:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .nav a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--sans); letter-spacing: .04em; padding: 5px 9px; border-radius: 999px; background: var(--surface2); color: var(--ink); white-space: nowrap }
.pill.wine { background: color-mix(in srgb, var(--wine) 14%, transparent); color: var(--wine) }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok) }
.pill.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn) }
.pill.bad { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad) }
.strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; -webkit-overflow-scrolling: touch }
.strip img, .strip .ph { scroll-snap-align: start; flex: 0 0 auto; height: 220px; width: auto; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2) }
.strip .ov { position: relative; flex: 0 0 auto; height: 220px; aspect-ratio: 9/16; border-radius: 8px; overflow: hidden; background: repeating-conic-gradient(#3a3033 0 25%, #2a2224 0 50%) 0 0/20px 20px }
.strip .ov img { height: 100%; border: 0; border-radius: 0; background: transparent }
.strip video { height: 220px; border-radius: 8px; flex: 0 0 auto; background: #000 }
.quote { font: 600 19px/1.3 var(--serif) }
.quote em { color: var(--wine) }
.box { background: var(--surface2); border-radius: 10px; padding: 12px; display: grid; gap: 6px; min-width: 0 }
.box p, .card p { overflow-wrap: anywhere }
details > summary { cursor: pointer; font-weight: 600; list-style: none }
details > summary::-webkit-details-marker { display: none }
details > summary::after { content: " +"; color: var(--muted) }
details[open] > summary::after { content: " −" }
.script { display: grid; gap: 8px }
.script div { display: grid; grid-template-columns: 52px 1fr; gap: 8px }
.script span { font: 600 12px/1.6 var(--sans); color: var(--muted); font-variant-numeric: tabular-nums }
label { display: grid; gap: 5px; font: 600 13px/1.2 var(--sans) }
input, textarea, select { width: 100%; font: 15px/1.4 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px }
textarea { min-height: 84px; resize: vertical }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 22px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center }
.bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; display: flex }
.bar i { display: block; height: 100% }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted) }
.legend b { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px }
.table-wrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font: 700 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
td.t { white-space: normal; min-width: 160px }
.swatches { display: flex; gap: 8px; flex-wrap: wrap }
.swatches span { width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line) }
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px }
.refs figure { margin: 0; display: grid; gap: 6px }
.refs img { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 10px; border: 1px solid var(--line) }
.day { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line) }
.day:last-child { border-bottom: 0 }
.day .d { font: 600 22px/1 var(--serif); font-variant-numeric: tabular-nums }
.day .d small { display: block; font: 700 10px/1.4 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
.nav a { display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); text-decoration: none; font: 600 10.5px/1 var(--sans); letter-spacing: .04em; position: relative }
.nav a svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7 }
.nav a[aria-current="page"] { color: var(--wine) }
.nav .badge { position: absolute; top: 0; left: calc(50% + 6px); background: var(--wine); color: var(--wine-ink); font: 700 10px/16px var(--sans); min-width: 16px; height: 16px; border-radius: 99px; padding: 0 4px; text-align: center }
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(10, 6, 7, .45) }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.25) }
.sheet .inner { max-width: 720px; margin: 0 auto; display: grid; gap: 16px }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 4px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font: 600 14px/1.2 var(--sans); max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25) }
.more { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.more a { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; color: var(--ink); text-decoration: none; display: grid; gap: 4px }
.more a b { font: 600 18px/1.2 var(--serif) }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chips button { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: 600 13px/1 var(--sans); cursor: pointer }
.chips button[aria-pressed="true"] { background: var(--wine); color: var(--wine-ink); border-color: var(--wine) }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: sp .8s linear infinite }
@keyframes sp { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none } }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr } h1 { font-size: 27px } }
</style>

<main id="app" aria-live="polite">
  <div class="head"><span class="eyebrow">Central Núbia Citty</span><h1>Carregando sua central…</h1></div>
</main>
<nav class="nav" id="nav" aria-label="Menu principal"></nav>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="renderer.js"></script>
<script>
(() => {
'use strict';
// ================= estado =================
const S = {
  db: null, assets: null, sample: null, downloads: null, user: null,
  contents: [], products: [], references: [], metrics: [], learning: [], series: [], reports: [], radar: [], log: [],
  brand: null, usage: null, rotina: null, loaded: false, offline: false, busy: {}
};
const VIEWS = ['hoje', 'gravar', 'aprovar', 'prontos', 'calendario', 'resultados', 'vendas', 'marca'];
const TYPE = { reel7: 'Reel 7s', reelFalado: 'Reel falado', carrossel: 'Carrossel', stories: 'Stories', estatico: 'Post' };
const OBJ = { crescimento: 'Crescimento', autoridade: 'Autoridade', conversao: 'Conversão' };
const OBJ_COLOR = { crescimento: 'var(--wine)', autoridade: 'var(--gold)', conversao: 'var(--ok)' };
const STATUS = { aprovar: ['Aguardando aprovação', 'warn'], gravar: ['Gravar', 'wine'], pronto: ['Pronto', 'ok'], agendado: ['Agendado', 'ok'], publicado: ['Publicado', ''], rejeitado: ['Rejeitado', 'bad'] };
const STYLE_NAME = { editorial: 'Editorial sofisticado', lifestyle: 'Lifestyle com foto', colagem: 'Colagem criativa', jornalistico: 'Jornalístico provocativo', minimal: 'Minimalismo tipográfico' };
const REJECT_REASONS = ['Não é a minha voz', 'Gancho fraco', 'Tema repetido', 'Risco jurídico ou ético', 'Muito comercial', 'Parece texto de IA', 'Opinião que não é minha'];

const DEFAULT_BRAND = {
  voz: ['Autêntica, inteligente e direta.', 'Provocativa e bem-humorada, ocasionalmente ácida.', 'Sofisticada e conversacional, como quem fala com uma amiga inteligente.', 'Emocional só quando existe uma história verdadeira.', 'Juridicamente responsável.', 'Personalidade antes de aula: nem todo post é sobre Direito.'],
  evitar: ['Frases motivacionais genéricas.', 'Juridiquês.', 'Texto com cara de IA (listas mornas, "neste post", "é importante ressaltar").', 'Travessões.', 'Ganchos fracos e elogios vazios.', 'Conteúdo excessivamente comercial.', 'Histórias pessoais inventadas.', 'Opiniões atribuídas à Núbia sem validação.'],
  regraPrincipal: 'Se a Núbia não falaria aquilo naturalmente, reescreva.',
  aprendidas: [],
  mix: { crescimento: 50, autoridade: 30, conversao: 20 },
  paleta: ['#6B1E2E', '#0F0D0D', '#FFFFFF', '#F6F1EA', '#E4D6C3', '#B08D57'],
  temas: ['Advocacia criminal', 'Direitos e garantias', 'Gestão de escritórios', 'Empreendedorismo', 'Liderança feminina', 'Marketing jurídico', 'IA no trabalho', 'Maternidade', 'Casamento', 'Vida pessoal e viagens', 'Opiniões sociais e políticas'],
  oab: 'Respeitar o Código de Ética da OAB e o Provimento 205/2021: caráter informativo, sem promessa de resultado, sem captação ou mercantilização, sem preço de serviços advocatícios em publicidade, sem expor clientes ou casos identificáveis.'
};

// ================= utilidades =================
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rich = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>');
const plain = (s) => String(s || '').replace(/\*/g, '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();
const ymd = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const today = () => ymd(new Date());
const fmtDay = (s) => new Date(s + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' });
const weekStart = (d = new Date()) => { const x = new Date(d); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return ymd(x); };
const addDays = (s, n) => { const x = new Date(s + 'T12:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
const num = (v) => { if (v == null || v === '') return null; const n = Number(String(v).replace(/\./g, '').replace(',', '.').replace(/[^\d.-]/g, '')); return Number.isFinite(n) ? n : null; };
const pct = (a, b) => (a != null && b) ? (a / b * 100) : null;
const f1 = (n) => n == null ? '–' : n.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const brand = () => S.brand || DEFAULT_BRAND;
const view = () => { const h = location.hash.replace('#', ''); return VIEWS.includes(h) ? h : 'hoje'; };
const col = (n) => S.db.collection(n);

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function needDb() { if (!S.db) { toast('Abra pelo claude.ai com sua conta para salvar.'); return false; } return true; }
async function log(acao, alvo) { if (S.db) try { await col('log').add({ at: now(), acao, alvo: alvo || '' }); } catch (e) { /* registro é melhor esforço */ } }
async function countUsage() {
  if (!S.db) return;
  const mes = today().slice(0, 7); const u = S.usage && S.usage.mes === mes ? S.usage : { mes, chamadas: 0 };
  try { await col('settings').doc('usage').set({ mes, chamadas: (u.chamadas || 0) + 1, atualizado: now() }); } catch (e) { }
}

// ================= conexão =================
async function boot() {
  route();
  window.addEventListener('hashchange', route);
  NCRender.ready().then(() => { S.fontsReady = true; render(); });
  const c = window.claude;
  if (!c || !c.use) { S.offline = true; S.loaded = true; render(); return; }
  const [db, assets, sample, downloads, user] = await Promise.all(['db', 'assets', 'sample', 'downloads', 'user'].map(n => c.use(n).catch(() => null)));
  Object.assign(S, { db, assets, sample, downloads, user });
  if (!db) { S.offline = true; S.loaded = true; render(); return; }
  const sub = (name, key, q) => (q || col(name)).onSnapshot(snap => { S[key] = snap.docs.map(d => Object.assign({ id: d.id }, d.data())); S.loaded = true; render(); }, () => { S.loaded = true; render(); });
  sub('contents', 'contents'); sub('products', 'products'); sub('references', 'references'); sub('metrics', 'metrics');
  sub('series', 'series'); sub('reports', 'reports'); sub('radar', 'radar');
  sub('learning', 'learning', col('learning').orderBy('at', 'desc').limit(150));
  sub('log', 'log', col('log').orderBy('at', 'desc').limit(40));
  col('settings').doc('brand').onSnapshot(d => { S.brand = d.exists ? d.data() : null; render(); });
  col('settings').doc('usage').onSnapshot(d => { S.usage = d.exists ? d.data() : null; render(); });
  col('settings').doc('rotina').onSnapshot(d => { S.rotina = d.exists ? d.data() : null; render(); });
  setTimeout(() => { S.loaded = true; render(); }, 2500);
}

function route() { renderNav(); render(); window.scrollTo(0, 0); }

// ================= navegação =================
const ICON = {
  hoje: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>',
  gravar: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13.5" height="12" rx="2.5"/><path d="M16 10.2l5.5-3v9.6l-5.5-3z"/></svg>',
  aprovar: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 12.3l3 3 6-6.3"/></svg>',
  prontos: '<svg viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10.5l4.5 4.5 4.5-4.5M4 17.5v1.5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5"/></svg>',
  mais: '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.8"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.8"/></svg>'
};
function renderNav() {
  const v = view(); const n = (st) => S.contents.filter(c => c.status === st).length;
  const items = [['hoje', 'Hoje'], ['gravar', 'Gravar', n('gravar')], ['aprovar', 'Aprovar', n('aprovar')], ['prontos', 'Prontos'], ['mais', 'Mais']];
  $('#nav').innerHTML = items.map(([k, label, badge]) => {
    const cur = k === v || (k === 'mais' && ['calendario', 'resultados', 'vendas', 'marca'].includes(v));
    return `<a href="${k === 'mais' ? '#' : '#' + k}" data-nav="${k}" ${cur ? 'aria-current="page"' : ''}>${ICON[k]}<span>${label}</span>${badge ? `<span class="badge">${badge}</span>` : ''}</a>`;
  }).join('');
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-nav="mais"]');
  if (a) { e.preventDefault(); openSheet(`<h2>Mais</h2><div class="more">
    <a href="#calendario" data-close><b>Calendário</b><span class="small muted">Programação das publicações</span></a>
    <a href="#resultados" data-close><b>Resultados</b><span class="small muted">Métricas e relatórios</span></a>
    <a href="#vendas" data-close><b>Vendas</b><span class="small muted">Produtos e campanhas</span></a>
    <a href="#marca" data-close><b>Minha marca</b><span class="small muted">Voz, séries, referências</span></a></div>`); }
});

// ================= folhas e camadas =================
function openSheet(html, mount) {
  const layer = $('#layer');
  layer.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="inner"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow = 'hidden';
  const el = $('.sheet .inner', layer);
  if (mount) mount(el);
  const first = el.querySelector('input, textarea, select, button'); if (first && !('ontouchstart' in window)) first.focus();
  return el;
}
function closeSheet() { $('#layer').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

// ================= pré-visualização das artes =================
const previewCache = new Map();
function previewSrc(c, item) {
  const file = (c.files || []).find(f => f.name === item.name && f.url);
  if (file) return file.url;
  const key = c.id + '|' + (c.updatedAt || '') + '|' + item.name + '|' + (S.fontsReady ? 1 : 0);
  if (!previewCache.has(key)) {
    try { previewCache.set(key, NCRender.render(item.spec).toDataURL('image/jpeg', 0.82)); } catch (e) { previewCache.set(key, ''); }
  }
  return previewCache.get(key);
}
function strip(c) {

// ---------- resultados ----------
function analyze() {
  const rows = S.metrics.map(m => Object.assign({}, m, { reach: num(m.reach), views: num(m.views), likes: num(m.likes), comments: num(m.comments), shares: num(m.shares), saves: num(m.saves), follows: num(m.follows), profileVisits: num(m.profileVisits) }));
  const by = {};
  rows.forEach(r => { const k = r.format || 'Sem formato'; (by[k] = by[k] || []).push(r); });
  const avg = (arr, f) => { const v = arr.map(f).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const formats = Object.entries(by).map(([k, arr]) => ({ format: k, n: arr.length, reach: avg(arr, r => r.reach ?? r.views), shareRate: avg(arr, r => pct(r.shares, r.reach ?? r.views)), saveRate: avg(arr, r => pct(r.saves, r.reach ?? r.views)), engRate: avg(arr, r => pct((r.likes || 0) + (r.comments || 0) + (r.shares || 0) + (r.saves || 0), r.reach ?? r.views)), follows: avg(arr, r => r.follows) }));
  const score = (r) => pct((r.shares || 0) + (r.saves || 0), r.reach ?? r.views);
  const ranked = rows.filter(r => score(r) != null).sort((a, b) => score(b) - score(a));
  return { rows, formats, top: ranked.slice(0, 5), bottom: ranked.slice(-5).reverse(), score };
}

async function learn(action, c, extra) {

  await col('learning').add(Object.assign({ at: now(), action, contentId: c.id, type: c.type, objective: c.objective, series: c.series || null, title: plain(c.title), texto: mainText(c) }, extra || {}));

function mainText(c) {
  const p = c.payload || {};
  if (c.type === 'reel7') return plain(p.frase);
  if (c.type === 'reelFalado') return plain(p.gancho) + ' | ' + (p.roteiro || []).map(b => b.fala).join(' ').slice(0, 500);
  if (c.type === 'carrossel') return (p.cards || []).map(cd => plain(cd.title)).join(' | ');
  if (c.type === 'stories') return (p.stories || []).map(s => plain(s.texto)).join(' | ');
  if (c.type === 'estatico') return plain(p.card?.title);
  return '';
}

}

function normalize(type, raw) {
  const r = raw && typeof raw === 'object' ? raw : {}; const p = r.payload || {};
  if (type === 'carrossel') { p.cards = (p.cards || []).filter(x => x && x.title).slice(0, 7); if (p.cards.length < 4) throw new Error('A IA devolveu menos de 4 cards. Gere de novo.'); }
  if (type === 'stories') { p.stories = (p.stories || []).filter(x => x && x.texto).slice(0, 6); if (!p.stories.length) throw new Error('A IA não devolveu stories. Gere de novo.'); }
  if (type === 'reel7' && !p.frase) throw new Error('A IA não devolveu a frase. Gere de novo.');
  if (type === 'reelFalado') { if (!p.roteiro?.length) throw new Error('A IA não devolveu roteiro. Gere de novo.'); p.duracao = p.duracao || p.roteiro[p.roteiro.length - 1].fim || 60; }
  if (type === 'estatico' && !p.card?.title) throw new Error('A IA não devolveu o texto do post. Gere de novo.');
  if (type === 'reel7') p.duracao = 7;
  const style = NCRender.STYLES.includes(r.style) ? r.style : 'editorial';
  return { title: plain(r.title) || 'Sem título', style, payload: p, precisaInputPessoal: !!r.precisaInputPessoal, perguntaPessoal: r.perguntaPessoal || '', validarOpiniao: r.validarOpiniao || '', riscos: r.riscos || '' };
}
async function callAI(prompt) {
  if (!S.sample) throw new Error('A geração por IA precisa ser aberta pelo claude.ai e autorizada.');
  const out = await S.sample.json(prompt, { modelTier: 'complex' });
  countUsage();
  return out;
}

async function generate(o) {
  if (!needDb()) return null;
  const tmpId = 'novo-' + uid(); S.busy[tmpId] = 'Gerando…';
  const raw = await callAI(buildPrompt(o));
  delete S.busy[tmpId];

async function regenerate(c, feedback) {

// ================= produção das artes =================
function loadImg(url) { return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
async function produzirArquivos(c) {
  if (!S.assets || !S.db) return;
  S.busy[c.id] = 'Produzindo artes…'; render();
  try {
    await NCRender.ready();
    const photoRef = c.photoRefId ? S.references.find(r => r.id === c.photoRefId) : null;
    const photo = photoRef?.url ? await loadImg(photoRef.url).catch(() => null) : null;
    const old = (c.files || []).filter(f => f.kind === 'arte');
    const files = (c.files || []).filter(f => f.kind !== 'arte');
    for (const it of NCRender.specsFor(c)) {
      if (photo && it.spec.style === 'lifestyle') it.spec.photo = photo;
      const cv = NCRender.render(it.spec);
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const up = await S.assets.upload(blob, { type: 'image/png' });
      files.unshift({ name: it.name, url: up.url, assetId: up.id, w: cv.width, h: cv.height, kind: 'arte' });
    }
    files.sort((a, b) => a.name.localeCompare(b.name));
    await col('contents').doc(c.id).update({ files, updatedAt: now() });
    for (const f of old) if (f.assetId) S.assets.delete(f.assetId).catch(() => null);
  } catch (e) { console.error(e); toast('Não consegui salvar as artes: ' + (e.message || e.code || 'erro')); }
  finally { delete S.busy[c.id]; render(); }
}

async function fileBlob(c, it) {
  const f = (c.files || []).find(x => x.name === it.name && x.url);
  if (f) { try { const r = await fetch(f.url); if (r.ok) return await r.blob(); } catch (e) { } }
  await NCRender.ready(); const cv = NCRender.render(it.spec); return await new Promise(r => cv.toBlob(r, 'image/png'));
}
function textos(c) {
  const p = c.payload || {}; const L = [plain(c.title), `${TYPE[c.type]} · ${OBJ[c.objective]}${c.seriesName ? ' · ' + c.seriesName : ''}`, ''];
  if (c.type === 'reel7') L.push('FRASE NA TELA', plain(p.frase), '', 'ALTERNATIVAS', ...(p.alternativas || []).map(a => '- ' + plain(a)), '', 'CENA', p.cena || '', '', 'TRILHA', p.trilha || '', '');
  if (c.type === 'reelFalado') L.push('GANCHO', p.gancho || '', '', 'ROTEIRO', ...(p.roteiro || []).map(b => `[${b.inicio}s-${b.fim}s] ${b.fala}`), '', 'COMO GRAVAR', ...(p.orientacoes || []).map(o => '- ' + o), '', 'CORTES', ...(p.cortes || []).map(o => '- ' + o), '');
  if (c.type === 'carrossel') L.push('CARDS', ...(p.cards || []).map((cd, i) => `${i + 1}. ${plain(cd.title)}${cd.body ? ' | ' + plain(cd.body) : ''}`), '');
  if (c.type === 'stories') L.push('STORIES', ...(p.stories || []).map((s, i) => `${i + 1}. ${plain(s.texto)}${s.apoio ? ' | ' + plain(s.apoio) : ''} (figurinha: ${s.sticker?.tipo || 'nenhuma'}${s.sticker?.opcoes?.length ? ': ' + s.sticker.opcoes.join(' / ') : ''})`), '');
  if (p.legenda) L.push('LEGENDA', plain(p.legenda), '');
  if (p.cta) L.push('CTA', p.cta, '');
  return L.join('\n');
}
function srt(c) {
  const t = (s) => `00:${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')},000`;
  return (c.payload?.roteiro || []).map((b, i) => `${i + 1}\n${t(b.inicio)} --> ${t(b.fim)}\n${b.fala}\n`).join('\n');
}
async function save(filename, data) {

  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const dur = Math.min(7, v.duration || 7);
  const drawFrame = () => {
    const r = Math.max(1080 / v.videoWidth, 1920 / v.videoHeight); const w = v.videoWidth * r, h = v.videoHeight * r;
    ctx.drawImage(v, (1080 - w) / 2, (1920 - h) / 2, w, h);
    ctx.globalAlpha = Math.min(1, Math.max(0, (v.currentTime - 0.3) / 0.5)); ctx.drawImage(overlay, 0, 0); ctx.globalAlpha = 1;
  };
  v.currentTime = 0; await v.play(); rec.start(250);
  await new Promise((res) => { const tick = () => { drawFrame(); if (v.currentTime >= dur || v.ended) return res(); requestAnimationFrame(tick); }; tick(); });
  v.pause(); rec.stop(); await new Promise(r => { rec.onstop = r; });
  URL.revokeObjectURL(v.src);
  return { blob: new Blob(chunks, { type: mime.split(';')[0] }), ext: mime.includes('mp4') ? 'mp4' : 'webm' };
}

  likes: ['curtidas', 'likes', 'me gusta'], comments: ['comentários', 'comentarios', 'comments'], shares: ['compartilhamentos', 'compartilhados', 'shares', 'envios'],
  saves: ['salvos', 'salvamentos', 'saved', 'saves', 'guardados'], follows: ['seguidores', 'follows', 'novos seguidores', 'follower'], profileVisits: ['visitas ao perfil', 'profile visits', 'visitas']
};
function parseCSV(text) {
  const first = text.split(/\r?\n/)[0] || ''; const delim = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') ? '\t' : ',');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; continue; }
    if (ch === '"') q = true; else if (ch === delim) { row.push(cell); cell = ''; } else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function openImport() {
  openSheet(`<h2>Importar métricas</h2><p class="small muted">Aceita CSV do Metricool (relatório de publicações do Instagram) ou do Meta Business Suite. As colunas são reconhecidas pelo nome.</p>
    <label for="im-file">Arquivo CSV<input type="file" id="im-file" accept=".csv,text/csv"></label><div id="im-out" class="stack"></div>`, (el) => {
    $('#im-file', el).addEventListener('change', async () => {
      const f = $('#im-file', el).files[0]; if (!f) return;
      const rows = parseCSV(await f.text()); if (rows.length < 2) { $('#im-out', el).innerHTML = '<p class="small">Arquivo vazio.</p>'; return; }
      const head = rows[0].map(h => h.trim().toLowerCase()); const idx = {};
      Object.entries(MAP).forEach(([k, names]) => { const i = head.findIndex(h => names.some(n => h === n || h.includes(n))); if (i >= 0) idx[k] = i; });
      const unmapped = head.filter((h, i) => !Object.values(idx).includes(i));
      const data = rows.slice(1).map(r => { const o = { source: 'csv:' + f.name, importadoEm: now() }; Object.entries(idx).forEach(([k, i]) => { o[k] = (r[i] || '').trim(); }); return o; });
      $('#im-out', el).innerHTML = `<div class="box"><p class="small"><b>${data.length}</b> publicações. Colunas reconhecidas: ${Object.keys(idx).map(k => `<span class="pill">${k}</span>`).join(' ') || 'nenhuma'}</p>${unmapped.length ? `<p class="small muted">Ignoradas: ${unmapped.map(esc).join(', ')}</p>` : ''}</div>
        <button class="btn primary" id="im-ok" ${Object.keys(idx).length < 2 ? 'disabled' : ''}>Importar ${data.length}</button>`;
      $('#im-ok', el).addEventListener('click', async (ev) => { if (!needDb()) return; ev.currentTarget.disabled = true;
        for (const d of data) await col('metrics').add(d);
        log('importou métricas', f.name + ' (' + data.length + ')'); closeSheet(); toast(data.length + ' publicações importadas'); });
    });
  });
}
